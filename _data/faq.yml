# 자주 묻는 질문 ─ 문의 페이지에 표시됩니다.
- q: 한 번 측정하는 데 얼마나 걸리나요?
  a: 용탕을 CE-Cup에 부은 뒤 최대 2분 30초 이내에 측정결과가 표시됩니다.
- q: 무엇을 측정할 수 있나요?
  a: 탄소당량(CE), 탄소량(C%), 규소량(Si%)과 초정(TL)·공정(TE) 온도를 측정하고, 냉각곡선 그래프를 함께 기록합니다.
- q: CE-Cup 같은 소모품은 어디서 구매하나요?
  a: 판매 및 A/S 대리점인 삼성계기에서 CE-Cup, 온도계, 관련 부자재를 구매하실 수 있습니다. 구매·A/S 페이지를 참고해 주세요.
- q: 측정결과를 회사 ERP로 보낼 수 있나요?
  a: 네. 측정결과를 UDP 통신으로 JSON 전문을 만들어 ERP에 연계할 수 있습니다. USB/LAN 인쇄와 USB 메모리 이전도 지원합니다.
- q: 과거 측정 기록을 다시 볼 수 있나요?
  a: 측정결과를 최대 3,000개까지 저장하며, 이력 조회 화면에서 과거 결과를 다시 보고 인쇄할 수 있습니다.
